
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>My first web-page</title>
  <style>
    body {
      background-color: #e79a9a;
      font-family: 'Arial', sans-serif;
      text-align: center;
      direction: rtl;
    }

    .header {
      background-color: black;
      color: white;
      padding: 30px;
      font-size: 36px;
      font-weight: bold;
    }

    .info-box {
      background-color: red;
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      color: white;
      font-size: 20px;
      box-shadow: 5px 5px 10px #333;
      border-radius: 10px;
    }

    .info-box p {
      margin: 5px 0;
    }

    .form-box {
      margin-top: 20px;
    }

    input[type="email"],
    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #444;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #222;
    }
  </style>
</head>
<body>
  <div class="header">My first web-page</div>

  <div class="info-box">
    <p><strong>الاسم:</strong> بسملة أحمد فايق السيد</p>
    <p><strong>الشفرة:</strong> 20231281</p>
  </div>

  <div class="form-box">
    <form>
      <input type="email" value="ba20231281@sva.edu.eg" readonly><br>
      <input type="password" placeholder="أدخل كلمة المرور"><br>
      <input type="password" name="password"/>
      <button type="submit">إرسال</button>
    </form>
  </div>
</body>
</html>
